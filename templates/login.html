{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>С возвращением · Youtube</title>
</head>
<body class="page">
    <div class="box">
        <div class="left">
            <div class="logo">
                <div class="icon"></div>
                Youtube<div style="color:#ff7189">.</div>
            </div>
            <div class="picture">
                <div class="circle"></div>
                <div class="circle big"></div>
                <div class="play"></div>
            </div>
            <div class="text">
                <h2>Каждая история<br>начинается с тебя.</h2>
            </div>
        </div>
        <div class="right">
            <h1 class="title">Здраствуйте</h1>
            <form class="form" method="post">
                {% csrf_token %}
                <div class="group">
                    Имя пользователя
                    <input class="input" type="text" name="username" placeholder="Твой никн">
                </div>
                <div class="group">
                    Электронная почта
                    <input class="input" type="email" name="email" placeholder="you@example.com">
                </div>
                <div class="group">
                    Пароль
                    <input class="input" type="password" name="password" placeholder="Введи парол">
                </div>
                <button class="button">Войти</button>
            </form>
            <p class="bottom">Ещё нет аккаунта? <a class="link" href="/">Зарегистрироваться</a></p>
        </div>
    </div>
</body>
</html>
